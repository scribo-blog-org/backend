# Выкладка NestJS API при push в master.
# Job один: падение lint, test или сборки останавливает пайплайн до push и SSH.

name: Deploy

on:
  push:
    branches:
      - master

# Встроенный GITHUB_TOKEN может публиковать образ в ghcr.io этого репозитория
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      # Версия из package.json engines: "node": "22.x". Кэш npm по package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        run: npm ci

      # Без успешного lint дальше job не идёт
      - name: Lint
        run: npm run lint

      # Без успешных тестов образ не собирается и не выкатывается
      - name: Test
        run: npm run test

      # Два тега одного образа: неизменяемый sha коммита и latest
      - name: Docker build
        run: |
          docker build \
            -t "ghcr.io/scribo-blog-org/backend:${{ github.sha }}" \
            -t "ghcr.io/scribo-blog-org/backend:latest" \
            .

      # Вход в GHCR встроенным токеном Actions. Отдельный PAT не нужен
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикация обоих тегов. Ошибка push останавливает job до SSH
      - name: Push images
        run: |
          docker push "ghcr.io/scribo-blog-org/backend:${{ github.sha }}"
          docker push "ghcr.io/scribo-blog-org/backend:latest"

      # На сервере сервис compose называется backend. Обновляем BACKEND_TAG и перезапускаем только его
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/scribo &&
            sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=${{ github.sha }}/" .env &&
            docker compose pull backend &&
            docker compose up -d backend
